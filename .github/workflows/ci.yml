name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install schema validator
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run release gate
        run: scripts/release-check.sh
      - name: Read validated release version
        id: release_version
        run: echo "version=$(python3 scripts/check-maintenance.py --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: solcompat-v${{ steps.release_version.outputs.version }}-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
