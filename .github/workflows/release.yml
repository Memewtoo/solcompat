name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to validate and recover
        required: true
        type: string
      published_packages:
        description: Packages already verified on crates.io for this tagged version
        required: true
        default: none
        type: choice
        options: [none, core, core-and-project, all]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      PUBLISHED_PACKAGES: ${{ inputs.published_packages || 'none' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install schema validator
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate tag and package release
        run: |
          python3 scripts/check-maintenance.py --tag "$RELEASE_TAG"
          scripts/release-check.sh
      - name: Authenticate with crates.io
        if: env.PUBLISHED_PACKAGES != 'all'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates.io packages
        if: env.PUBLISHED_PACKAGES != 'all'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          case "$PUBLISHED_PACKAGES" in
            none) cargo publish --workspace --locked ;;
            core) cargo publish --package solcompat-project --package solcompat --locked ;;
            core-and-project) cargo publish --package solcompat --locked ;;
            *) echo "Invalid recovery selection" >&2; exit 1 ;;
          esac
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
